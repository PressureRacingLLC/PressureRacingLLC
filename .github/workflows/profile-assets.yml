# Builds the stat cards, then publishes them to the `output` branch.
# README.md loads them from raw.githubusercontent.com/<owner>/<repo>/output/...
name: Profile assets

on:
  schedule:
    - cron: "17 */12 * * *"
  workflow_dispatch:
  push:
    paths:
      - scripts/stats.py
      - .github/workflows/profile-assets.yml

permissions:
  contents: write

concurrency:
  group: profile-assets
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Stat cards
        run: python scripts/stats.py "${{ github.repository_owner }}" dist
        env:
          # Optional METRICS_TOKEN (classic PAT: read:user + repo) adds private-repo languages.
          GH_TOKEN: ${{ secrets.METRICS_TOKEN || github.token }}

      - name: Publish to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
          commit_message: "Update profile assets"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
