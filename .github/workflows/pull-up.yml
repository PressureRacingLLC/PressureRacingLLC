# The Lot. The README's PULL UP button opens an issue titled "pull-up|lot"; this parks the
# visitor in the lot, redraws assets/live/lot.svg, then replies and closes the issue.
name: Pull up

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

concurrency:
  group: lot
  cancel-in-progress: false

jobs:
  park:
    if: startsWith(github.event.issue.title, 'pull-up|')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - run: pip install --quiet fonttools brotli

      - name: Park
        run: python scripts/lot.py "$DRIVER"
        env:
          DRIVER: ${{ github.event.issue.user.login }}

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/lot.json assets/live/lot.svg
          git diff --cached --quiet && exit 0
          git commit -m "The Lot: @$DRIVER pulled up"
          for i in 1 2 3; do git pull --rebase -q origin main && git push -q && exit 0; sleep 3; done
          exit 1
        env:
          DRIVER: ${{ github.event.issue.user.login }}

      - name: Reply and close
        run: |
          gh issue comment "$NUM" --body "You're parked in spot 01. See you in the lot: https://github.com/${{ github.repository_owner }}"
          gh issue close "$NUM"
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          NUM: ${{ github.event.issue.number }}
